<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discover Stores | KiranaWala</title>

    <!-- Google Fonts — Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="premium-dashboard">

    <header class="premium-header">
        <div class="premium-header-content">
            <a href="/" class="brand-logo">KiranaWala</a>

            <div class="header-controls">
                <button class="logout-link" onclick="logout()">Sign Out</button>
            </div>
        </div>
    </header>

    <main class="dashboard-main">
        <section class="hero-section">
            <h1 class="hero-title">Groceries from stores near you</h1>
            <p class="hero-subtitle">Discover local stores and shop nearby.</p>
            <div id="location-status" class="location-indicator" aria-live="polite">
                📍 Getting location...
            </div>
        </section>

        <!-- Map section — hidden until location is available -->
        <section class="map-wrapper" id="map-section" hidden>
            <div id="map"></div>
        </section>

        <!-- Location unavailable placeholder — shown when location is denied -->
        <section class="map-placeholder" id="map-placeholder" hidden>
            <div class="map-placeholder-inner">
                <span class="map-placeholder-icon">🗺️</span>
                <p class="map-placeholder-text">Enable location to see nearby stores on the map.</p>
            </div>
        </section>

        <section class="discovery-section">
            <h2 class="section-title">Nearby Stores</h2>
            <div class="premium-stores-grid" id="stores-container">
                <!-- Stores will be dynamically loaded here by dashboard.js -->
            </div>
        </section>
    </main>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>

    <!-- Custom Dashboard Logic -->
    <script src="/customer/dashboard.js"></script>
</body>
</html>
